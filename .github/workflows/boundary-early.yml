{"name": "boundary-early", "on": {"push": {"branches": ["boundary-*"], "paths": ["0/last.txt"]}, "pull_request": {"branches": ["main"], "paths": ["0/last.txt"]}}, "permissions": {}, "jobs": {"observe": {"runs-on": "ubuntu-latest", "timeout-minutes": 2, "steps": [{"run": "printf \"EVENT=%s SHA=%s REF=%s\\n\" \"$GITHUB_EVENT_NAME\" \"$GITHUB_SHA\" \"$GITHUB_REF\""}]}}}